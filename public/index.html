<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Keeper</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1b202c;
    --line: #262c3a;
    --text: #eef1f7;
    --muted: #96a0b5;
    --accent: #ffb020;
    --accent-ink: #1a1200;
    --gold: #ffcf5c; --silver: #c9d2e3; --bronze: #d99a6c;
    --danger: #ff6b78;
    --radius: 16px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  ::selection { background: #ffb02055; }
  body {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    min-height: 100dvh;
    background: radial-gradient(900px 500px at 50% -200px, #ffb02022, transparent 60%), var(--bg);
    padding: 1.25rem 1rem 7rem;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }
  button { font: inherit; cursor: pointer; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  h1 { margin: 0; font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  h1 em { font-style: normal; color: var(--accent); }
  .status { color: var(--muted); font-weight: 500; margin-top: .45rem; }
  .status b { color: var(--text); font-weight: 700; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--muted); padding: .55rem .9rem; border-radius: 999px; font-size: .85rem; font-weight: 700; white-space: nowrap; transition: color .15s, border-color .15s; }
  .ghost:hover { color: var(--text); border-color: var(--muted); }

  form.add { display: flex; gap: .5rem; }
  form.add input { flex: 1; min-width: 0; }
  input { font: inherit; font-weight: 500; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .8rem 1.1rem; outline: none; transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: var(--muted); }
  input[type=number] { font-family: "JetBrains Mono", monospace; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
  input[type=number]::-webkit-inner-spin-button { display: none; }
  :is(input, button):focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px #ffb02044; outline: none; }
  .primary { font-weight: 800; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: .8rem 1.25rem; transition: filter .15s, transform .1s, opacity .2s; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .primary:active:not(:disabled) { transform: scale(.97); }
  .primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .chips button { background: var(--panel); border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: .35rem .75rem .35rem .5rem; font-size: .85rem; font-weight: 700; display: flex; align-items: center; gap: .35rem; transition: color .15s, border-color .15s, background .15s; }
  .chips button:hover { color: var(--text); border-color: var(--muted); border-style: solid; background: var(--panel-2); }
  .chips button span { font-size: 1.05rem; }

  .rules { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin: 1.1rem 0 1.25rem; padding: .55rem .6rem .55rem .9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; color: var(--muted); font-weight: 600; }
  .rules label { display: flex; align-items: center; gap: .45rem; }
  .rules input[type=number] { width: 4.6rem; padding: .35rem .7rem; text-align: center; background: var(--bg); font-weight: 700; color: var(--text); }
  .seg { margin-left: auto; display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: .2rem; }
  .seg button { border: 0; background: none; color: var(--muted); font-size: .8rem; font-weight: 700; padding: .3rem .7rem; border-radius: 999px; transition: background .15s, color .15s; }
  .seg button[aria-pressed=true] { background: var(--panel-2); color: var(--text); }
  @media (max-width: 480px) { .rules { border-radius: var(--radius); } .seg { margin-left: 0; width: 100%; } .seg button { flex: 1; } }

  .board { display: grid; gap: .6rem; }
  .player {
    position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "rank name total" "rank hist total" "rank entry entry";
    gap: .25rem .9rem; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem 1.05rem;
    overflow: hidden;
    transition: border-color .3s var(--ease), background .3s var(--ease);
  }
  /* Progress toward the target along the bottom edge */
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff0a; }
  .prog i { display: block; height: 100%; background: var(--muted); border-radius: 0 2px 2px 0; }
  .lead .prog i { background: var(--accent); }
  /* Score just entered: it floats up from the total and the newest chip pops in */
  .float { position: absolute; right: 2.6rem; top: .7rem; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.1rem; color: var(--accent); pointer-events: none; animation: floatUp .9s var(--ease) forwards; }
  .float.neg { color: var(--danger); }
  @keyframes floatUp { from { transform: translateY(8px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-30px); opacity: 0; } }
  .hist b.pop { animation: pop .4s var(--ease); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } 65% { transform: scale(1.18); } }
  /* Lead changes hands: a sheen sweeps the new leader and the crown drops in */
  .takeover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, #ffcf5c2e 50%, transparent 70%); transform: translateX(-100%); animation: sheen 1.1s var(--ease) .1s forwards; pointer-events: none; }
  @keyframes sheen { to { transform: translateX(100%); } }
  .takeover .crown { animation: crownDrop .6s var(--ease) both; }
  @keyframes crownDrop { from { transform: translateY(-12px) scale(2) rotate(-20deg); opacity: 0; } }
  .player.lead { background: linear-gradient(135deg, #2a2210, var(--panel) 60%); border-color: #ffb02066; }
  .player.new { animation: enter .35s var(--ease); }
  @keyframes enter { from { transform: translateY(8px); opacity: 0; } }
  .rank { grid-area: rank; align-self: start; display: grid; gap: .3rem; justify-items: center; }
  .rank b { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; font-family: "JetBrains Mono", monospace; font-weight: 700; background: var(--panel-2); color: var(--muted); }
  .r1 .rank b { background: var(--gold); color: #2a1d00; }
  .r2 .rank b { background: var(--silver); color: #1a1f2b; }
  .r3 .rank b { background: var(--bronze); color: #2a1408; }
  .avatar { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.3rem; display: grid; place-items: center; padding: 0; line-height: 1; transition: transform .15s var(--ease), border-color .15s; }
  .avatar:hover { transform: scale(1.12); border-color: var(--muted); }
  .name { grid-area: name; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; display: flex; align-items: center; gap: .45rem; min-width: 0; padding-right: 2rem; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crown { flex: none; width: 1.05em; height: 1.05em; color: var(--accent); }
  .hist { grid-area: hist; display: flex; flex-wrap: wrap; gap: .3rem; min-height: 1.2rem; align-self: start; }
  .hist b { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: .72rem; color: var(--muted); background: var(--panel-2); padding: .1rem .45rem; border-radius: 6px; }
  .hist b.neg { color: var(--danger); }
  .hist i { font-style: normal; font-size: .8rem; color: var(--muted); }
  .total { grid-area: total; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 2.1rem; line-height: 1; letter-spacing: -.02em; text-align: right; font-variant-numeric: tabular-nums; padding-right: 1.6rem; transition: color .3s var(--ease); }
  .total small { display: block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: .72rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-top: .3rem; }
  .lead .total { color: var(--accent); }
  .entry { grid-area: entry; display: flex; gap: .4rem; margin-top: .5rem; }
  .entry input { flex: 1; min-width: 0; padding: .55rem .9rem; font-size: .95rem; background: var(--bg); }
  .entry button { width: 2.75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); display: grid; place-items: center; transition: color .15s, border-color .15s; }
  .entry button svg { width: 1rem; height: 1rem; }
  .entry button:hover { border-color: var(--accent); color: var(--accent); }
  .del { position: absolute; top: .45rem; right: .45rem; width: 2.25rem; height: 2.25rem; border: 0; border-radius: 50%; background: none; color: var(--muted); display: grid; place-items: center; opacity: 0; transition: opacity .15s, background .15s, color .15s; }
  .del svg { width: .8rem; height: .8rem; }
  .player:hover .del, .player:focus-within .del, .del:focus-visible { opacity: 1; }
  @media (hover: none) { .del { opacity: .7; } }
  .del:hover, .del:focus-visible { background: var(--danger); color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; border: 1px dashed var(--line); border-radius: var(--radius); }
  .empty strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: .3rem; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem; background: linear-gradient(transparent, var(--bg) 40%); }
  .bar .primary { display: block; width: min(560px, 100%); margin: 0 auto; padding: 1rem; font-size: 1.05rem; box-shadow: 0 12px 28px -8px #000c; }

  /* Hall of fame */
  .fame { margin-top: 2rem; }
  .fame h2 { font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em; margin: 0 0 .6rem; }
  .fame ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
  .fame li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 1rem; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .55rem .9rem; font-weight: 600; }
  .fame li:first-child { border-color: #ffb02066; }
  .fame .who { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .fame .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fame .stat { font-family: "JetBrains Mono", monospace; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fame .stat b { color: var(--text); font-weight: 700; }
  .fame li:first-child .stat b { color: var(--accent); }

  /* Game over */
  .over { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 1rem; background: #0b0d12e6; overflow: hidden; animation: fade .3s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  .over[hidden] { display: none; }
  .over .card { position: relative; width: min(420px, 100%); text-align: center; background: var(--panel); border-radius: 24px; padding: 2rem 1.5rem 1.5rem; box-shadow: 0 30px 60px -20px #000; animation: rise .5s var(--ease); }
  @keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
  .over h2 { margin: .75rem 0 .2rem; font-size: 2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .over h2 b { color: var(--accent); }
  .over .score { font-family: "JetBrains Mono", monospace; font-size: 1.1rem; color: var(--muted); font-weight: 700; }
  @keyframes bounce { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-16px) rotate(6deg); } }
  /* Podium: 2nd, 1st, 3rd */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: .5rem; margin: 0 auto .25rem; width: min(320px, 100%); }
  .podium .step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .podium .face { font-size: 2.4rem; line-height: 1; margin-bottom: .4rem; }
  .podium .p1 .face { font-size: 3.6rem; animation: bounce 1s var(--ease) infinite alternate; }
  .podium .who { font-weight: 700; font-size: .85rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .pts { font-family: "JetBrains Mono", monospace; font-size: .72rem; color: var(--muted); margin-bottom: .4rem; }
  .podium .block { width: 100%; border-radius: 10px 10px 0 0; display: grid; place-items: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.1rem; transform-origin: bottom; animation: riseUp .55s var(--ease) both; }
  .podium .p1 .block { height: 84px; background: var(--gold); color: #2a1d00; animation-delay: .15s; }
  .podium .p2 .block { height: 58px; background: var(--silver); color: #1a1f2b; animation-delay: .3s; }
  .podium .p3 .block { height: 40px; background: var(--bronze); color: #2a1408; animation-delay: .45s; }
  @keyframes riseUp { from { transform: scaleY(0); } }
  .last { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: .75rem; }
  .last .face { font-size: 2.4rem; line-height: 1; display: inline-block; filter: grayscale(.6); animation: droop 2.4s ease-in-out infinite; transform-origin: top center; }
  @keyframes droop { 0%, 100% { transform: rotate(-14deg) translateY(2px); } 50% { transform: rotate(14deg) translateY(6px); } }
  .last b { color: var(--text); }
  .over .actions { display: flex; gap: .5rem; margin-top: 1.5rem; }
  .over .actions button { flex: 1; padding: .85rem; }
  .confetti { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: fall linear infinite; }
  @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: .8; } }

  /* Confirm dialog */
  dialog.confirm { background: var(--panel); color: var(--text); border: 0; border-radius: 20px; padding: 1.5rem 1.5rem 1.25rem; width: min(360px, calc(100% - 2rem)); box-shadow: 0 30px 60px -20px #000; animation: rise .35s var(--ease); }
  dialog.confirm::backdrop { background: #0b0d12cc; }
  dialog.confirm h3 { margin: 0 0 .35rem; font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
  dialog.confirm p { margin: 0; color: var(--muted); font-weight: 500; }
  dialog.confirm form { display: flex; gap: .5rem; margin-top: 1.25rem; }
  dialog.confirm form button { flex: 1; padding: .8rem; }
  dialog.confirm .danger { background: var(--danger); color: #fff; }

  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } .confetti { display: none; } }
</style>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="i-crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8zm2.6 9h12.8l1-5.6-2.8 2.4L12 8.8 7.4 13.8 4.6 11.4 5.6 17z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="wrap">
  <header>
    <div>
      <h1>Score<em>Keeper</em></h1>
      <div class="status" id="status" aria-live="polite">Round 0</div>
    </div>
    <button class="ghost" id="reset" hidden>New game</button>
  </header>

  <form class="add" id="addForm">
    <label class="sr" for="nameInput">Player name</label>
    <input id="nameInput" placeholder="Add a player…" required autocomplete="off" maxlength="24">
    <button class="primary">Add</button>
  </form>
  <div class="chips" id="chips"></div>

  <div class="rules">
    <label>Play to <input type="number" id="target" min="1" step="any" aria-label="Target score"></label>
    <div class="seg" role="group" aria-label="Who wins">
      <button id="highWins" aria-pressed="true">Highest wins</button>
      <button id="lowWins" aria-pressed="false">Lowest wins</button>
    </div>
  </div>

  <div class="board" id="players"></div>

  <section class="fame" id="fame" hidden>
    <h2>Hall of fame</h2>
    <ol id="fameList"></ol>
  </section>
</div>

<div class="bar" id="bar" hidden><button class="primary" id="enterAll" disabled>Enter round scores</button></div>

<div class="over" id="over" hidden role="dialog" aria-labelledby="overTitle">
  <div class="card">
    <div id="confetti"></div>
    <div class="podium" id="podium"></div>
    <h2 id="overTitle"></h2>
    <div class="last" id="last"></div>
    <div class="actions">
      <button class="ghost" id="keepPlaying">Keep playing</button>
      <button class="primary" id="newGame">New game</button>
    </div>
  </div>
</div>

<dialog class="confirm" id="confirm">
  <h3 id="confirmTitle"></h3>
  <p id="confirmMsg"></p>
  <form method="dialog">
    <button class="ghost" value="cancel">Cancel</button>
    <button class="primary" id="confirmOk" value="ok"></button>
  </form>
</dialog>

<script>
  const KEY = "score-keeper";
  // ponytail: localStorage, no backend — add a JSON file API in server.mjs if scores must survive across browsers
  // Quick-add names shown as chips; edit to your usual crew
  const SUGGESTED = { Alex: "🦁", Priya: "🌸", Sam: "🚀", Mia: "🦋", Kai: "⚡" };
  const EMOJI = ["🦁", "🌸", "🚀", "🦋", "⚡", "🐯", "🐼", "🦊", "🐸", "🐙", "🦄", "🐨", "🐧", "🐬", "🔥", "🎯", "🍕", "🌈"];
  const stored = JSON.parse(localStorage.getItem(KEY) || "[]");
  // Older saves were a bare players array; wrap them in the settings object
  const state = Array.isArray(stored) ? { players: stored, target: 200, lowWins: false, seen: false } : stored;
  state.players.forEach((p) => (p.emoji ||= SUGGESTED[p.name] || EMOJI[Math.floor(Math.random() * EMOJI.length)]));
  const { players } = state;

  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  const sum = (s) => +s.reduce((a, b) => a + b, 0).toFixed(2);
  const fmt = (n) => (n > 0 ? "+" : "") + n;
  const $ = (id) => document.getElementById(id);
  let newIndex = -1;
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Remembered between renders so totals can roll, bars can grow, and a lead change can be noticed
  let lastTotals = new Map(), lastLead = -1;
  const deltas = new Map(); // player index -> score just entered, consumed by the next render

  // Roll a number from one value to the next, keeping the decimals of the destination
  function countUp(el, from, to) {
    if (reduced() || from === to) { el.textContent = to; return; }
    const dec = (String(to).split(".")[1] || "").length, t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (from + (to - from) * e).toFixed(dec);
      if (k < 1) requestAnimationFrame(tick); else el.textContent = to;
    };
    requestAnimationFrame(tick);
  }
  // All-time roster from the backend, cached so a refresh shows real names instantly.
  // rosterState: "pending" until the first fetch settles, then "ok" or "failed"
  let roster = JSON.parse(localStorage.getItem(KEY + "-roster") || "[]");
  let rosterState = "pending";
  const emojiFor = (name) => roster.find((r) => r.name === name)?.emoji || SUGGESTED[name] || EMOJI[Math.floor(Math.random() * EMOJI.length)];
  async function loadRoster() {
    try {
      const res = await fetch("/api/leaderboard");
      if (!res.ok) throw new Error(res.status);
      roster = await res.json();
      localStorage.setItem(KEY + "-roster", JSON.stringify(roster));
      rosterState = "ok";
    } catch { rosterState = "failed"; } // offline or static-only: chips fall back to SUGGESTED
    render();
  }

  // In-app confirm on the native <dialog>; resolves true when the action button is chosen
  function ask(title, msg, action, danger = false) {
    const d = $("confirm");
    $("confirmTitle").textContent = title;
    $("confirmMsg").textContent = msg;
    const ok = $("confirmOk");
    ok.textContent = action;
    ok.className = danger ? "primary danger" : "primary";
    d.showModal();
    return new Promise((res) => {
      d.querySelector("form").onsubmit = (e) => res(e.submitter?.value === "ok");
      d.oncancel = () => res(false); // Escape
    });
  }

  function standings() {
    const dir = state.lowWins ? 1 : -1;
    const ranked = players.map((p, i) => ({ p, i, total: sum(p.scores) })).sort((a, b) => (a.total - b.total) * dir);
    ranked.forEach((r, pos) => (r.rank = pos > 0 && ranked[pos - 1].total === r.total ? ranked[pos - 1].rank : pos + 1));
    return ranked;
  }

  function render(focusIndex = -1) {
    const box = $("players");
    // FLIP: remember where each card was so a rank change slides instead of snapping
    const before = new Map([...box.children].map((el) => [el.dataset.index, el.getBoundingClientRect().top]));
    box.innerHTML = "";
    const round = Math.max(0, ...players.map((p) => p.scores.length));
    const ranked = standings();
    let lead = "";
    if (ranked.length > 1 && round > 0) {
      const gap = +Math.abs(ranked[0].total - ranked[1].total).toFixed(2);
      lead = gap === 0 ? ` · <b>${ranked[0].p.name}</b> and <b>${ranked[1].p.name}</b> tied` : ` · <b>${ranked[0].p.name}</b> leads by <b>${gap}</b>`;
    }
    $("status").innerHTML = `Round <b>${round}</b> · ${players.length} player${players.length === 1 ? "" : "s"} · first to <b>${state.target}</b>${state.lowWins ? " · lowest wins" : ""}${lead}`;
    $("reset").hidden = players.length === 0;
    $("bar").hidden = players.length === 0;
    $("enterAll").textContent = `Enter round ${round + 1} scores`;
    $("enterAll").disabled = true;
    $("target").value = state.target;
    $("highWins").setAttribute("aria-pressed", !state.lowWins);
    $("lowWins").setAttribute("aria-pressed", state.lowWins);

    const chips = $("chips");
    chips.innerHTML = "";
    // Placeholders only once we know there is no backend; never flash them before the roster loads
    const suggestions = roster.length ? roster.map((r) => [r.name, r.emoji]) : rosterState === "failed" ? Object.entries(SUGGESTED) : [];
    suggestions.filter(([n]) => !players.some((p) => p.name === n)).forEach(([n, e]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span></span>`;
      b.querySelector("span").textContent = e;
      b.append(n);
      b.onclick = () => addPlayer(n);
      chips.appendChild(b);
    });

    const played = roster.filter((r) => r.games > 0);
    $("fame").hidden = !played.length;
    $("fameList").innerHTML = "";
    played.forEach((r) => {
      const li = document.createElement("li");
      li.innerHTML = `<div class="who"><span></span></div><span class="stat"><b>${r.wins}</b> win${r.wins === 1 ? "" : "s"}</span><span class="stat">${r.games} game${r.games === 1 ? "" : "s"}</span><span class="stat">${r.lasts} last</span>`;
      li.querySelector(".who span").textContent = `${r.emoji} ${r.name}`;
      $("fameList").appendChild(li);
    });

    if (!players.length) {
      box.innerHTML = `<div class="empty"><strong>No players yet</strong>Add a name or tap a suggestion to start the board.</div>`;
      return;
    }

    let leadIndex = -1;
    ranked.forEach(({ p, i, total, rank }) => {
      const lead = rank === 1 && p.scores.length > 0;
      if (lead && leadIndex < 0) leadIndex = i;
      const row = document.createElement("div");
      row.className = `player r${rank}` + (lead ? " lead" : "") + (i === newIndex ? " new" : "");
      const pct = Math.max(0, Math.min(100, (total / state.target) * 100));
      const prevTotal = lastTotals.get(i);
      const prevPct = prevTotal === undefined ? pct : Math.max(0, Math.min(100, (prevTotal / state.target) * 100));
      row.dataset.index = i;
      const toGo = +(state.target - total).toFixed(2);
      row.innerHTML = `
        <div class="rank"><b aria-label="Rank ${rank}">${rank}</b><button class="avatar" type="button" title="Change emoji"></button></div>
        <div class="name"><span></span>${lead ? '<svg class="crown"><title>Leader</title><use href="#i-crown"/></svg>' : ""}</div>
        <div class="hist"></div>
        <div class="total"><span class="num">${total}</span><small>${toGo > 0 ? `${toGo} to go` : "reached"}</small></div>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <form class="entry"><input type="number" step="any" placeholder="Score" required><button aria-label="Add score"><svg><use href="#i-plus"/></svg></button></form>
        <button class="del" aria-label="Remove player"><svg><use href="#i-x"/></svg></button>`;
      row.querySelector(".name span").textContent = p.name;
      const av = row.querySelector(".avatar");
      av.textContent = p.emoji;
      av.setAttribute("aria-label", `${p.name}'s emoji, tap to change`);
      av.onclick = () => { p.emoji = EMOJI[(EMOJI.indexOf(p.emoji) + 1) % EMOJI.length]; av.textContent = p.emoji; save(); };
      row.querySelector(".entry input").setAttribute("aria-label", `Score for ${p.name}`);
      row.querySelector(".del").setAttribute("aria-label", `Remove ${p.name}`);
      const hist = row.querySelector(".hist");
      if (!p.scores.length) hist.innerHTML = `<i>no scores yet</i>`;
      const hidden = Math.max(0, p.scores.length - 8);
      if (hidden) { const b = document.createElement("b"); b.textContent = `…${hidden} more`; b.title = p.scores.map(fmt).join(", "); hist.appendChild(b); }
      p.scores.slice(-8).forEach((s) => {
        const b = document.createElement("b");
        b.textContent = fmt(s);
        if (s < 0) b.className = "neg";
        hist.appendChild(b);
      });
      if (prevTotal !== undefined && prevTotal !== total) {
        countUp(row.querySelector(".num"), prevTotal, total);
        if (!reduced()) row.querySelector(".prog i").animate([{ width: `${prevPct}%` }, { width: `${pct}%` }], { duration: 600, easing: "cubic-bezier(.2,.7,.2,1)" });
      }
      if (deltas.has(i)) {
        hist.lastElementChild?.classList.add("pop");
        const f = document.createElement("span");
        f.className = "float" + (deltas.get(i) < 0 ? " neg" : "");
        f.textContent = fmt(deltas.get(i));
        row.appendChild(f);
        f.addEventListener("animationend", () => f.remove());
      }
      if (lead && leadIndex === i && lastLead !== -1 && lastLead !== i) row.classList.add("takeover");
      row.querySelector("form").onsubmit = (e) => {
        e.preventDefault();
        const v = Number(e.target.querySelector("input").value);
        p.scores.push(v);
        deltas.set(i, v);
        commit(i);
      };
      row.querySelector(".del").onclick = async () => {
        if (await ask(`Remove ${p.name}?`, "Their scores go with them.", "Remove", true)) { players.splice(i, 1); lastTotals.clear(); lastLead = -1; commit(); }
      };
      box.appendChild(row);
    });
    newIndex = -1;
    deltas.clear();
    lastTotals = new Map(ranked.map((r) => [r.i, r.total]));
    lastLead = leadIndex;

    // Slide cards from their old position to the new one
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      [...box.children].forEach((el) => {
        const prev = before.get(el.dataset.index);
        if (prev === undefined) return;
        const dy = prev - el.getBoundingClientRect().top;
        if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 380, easing: "cubic-bezier(.2,.7,.2,1)" });
      });
    }
    if (focusIndex >= 0) box.querySelector(`[data-index="${focusIndex}"] input`)?.focus();
  }

  function commit(focusIndex) {
    save(); render(focusIndex);
    const ranked = standings();
    if (!state.seen && ranked.some((r) => r.total >= state.target)) showGameOver(ranked);
  }

  function showGameOver(ranked) {
    const w = ranked[0], l = ranked[ranked.length - 1];
    const podium = $("podium");
    podium.innerHTML = "";
    [ranked[1], ranked[0], ranked[2]].forEach((r) => {
      if (!r) return;
      const step = document.createElement("div");
      step.className = `step p${Math.min(3, r.rank)}`;
      step.innerHTML = `<span class="face"></span><span class="who"></span><span class="pts">${r.total}</span><div class="block">${r.rank}</div>`;
      step.querySelector(".face").textContent = r.p.emoji;
      step.querySelector(".who").textContent = r.p.name;
      podium.appendChild(step);
    });
    $("overTitle").innerHTML = `<b></b> wins!`;
    $("overTitle").querySelector("b").textContent = w.p.name;
    navigator.vibrate?.([60, 40, 140]); // Android only; iOS ignores it
    const last = $("last");
    last.hidden = ranked.length < 2 || l.rank === w.rank;
    last.innerHTML = `<span class="face"></span><div><b></b> finishes last<br>${l.total} points</div>`;
    last.querySelector(".face").textContent = l.p.emoji;
    last.querySelector("b").textContent = l.p.name;
    const c = $("confetti");
    c.innerHTML = "";
    const colors = ["#ffb020", "#ffcf5c", "#ff6b78", "#5ce0ff", "#8bff8b", "#eef1f7"];
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-duration:${2.5 + Math.random() * 2}s;animation-delay:${Math.random() * 3}s;transform:scale(${.6 + Math.random()})`;
      c.appendChild(s);
    }
    $("over").hidden = false;
    $("newGame").focus();
    // Plays public/loser.m4a if present; falls back to the browser's speech engine
    new Audio("/loser.m4a").play().catch(() => {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("Losers!");
      u.rate = .85; u.pitch = .6;
      speechSynthesis.speak(u);
    });
    recordGame(ranked);
  }

  // Send the finished game to the backend once; ignored when offline or static-only
  function recordGame(ranked) {
    if (state.recorded) return;
    state.recorded = true; save();
    fetch("/api/games", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ target: state.target, lowWins: state.lowWins, results: ranked.map((r) => ({ name: r.p.name, emoji: r.p.emoji, total: r.total, rank: r.rank })) }),
    }).then(loadRoster).catch(() => {});
  }

  const dismiss = () => { state.seen = true; save(); $("over").hidden = true; };
  $("keepPlaying").onclick = dismiss;
  $("newGame").onclick = () => { newGame(); $("over").hidden = true; };
  $("over").addEventListener("keydown", (e) => e.key === "Escape" && dismiss());

  function newGame() {
    players.forEach((p) => (p.scores = []));
    state.seen = false;
    state.recorded = false;
    commit();
  }

  // Round button only lights up once at least one score is typed
  $("players").addEventListener("input", () => {
    $("enterAll").disabled = ![...document.querySelectorAll(".player .entry input")].some((i) => i.value !== "");
  });

  $("enterAll").onclick = () => {
    document.querySelectorAll(".player").forEach((row) => {
      const input = row.querySelector(".entry input");
      if (input.value !== "") { const v = Number(input.value); players[row.dataset.index].scores.push(v); deltas.set(+row.dataset.index, v); }
    });
    commit();
  };

  $("reset").onclick = async () => {
    if (await ask("Start a new game?", "Names stay, scores reset to zero.", "New game")) newGame();
  };

  $("target").onchange = (e) => {
    const v = Number(e.target.value);
    if (v > 0) { state.target = v; state.seen = false; commit(); } else e.target.value = state.target;
  };
  $("highWins").onclick = () => { state.lowWins = false; state.seen = false; commit(); };
  $("lowWins").onclick = () => { state.lowWins = true; state.seen = false; commit(); };

  function addPlayer(name) {
    newIndex = players.push({ name, scores: [], emoji: emojiFor(name) }) - 1;
    commit();
  }

  $("addForm").onsubmit = (e) => {
    e.preventDefault();
    const input = $("nameInput");
    const name = input.value.trim();
    if (!name) return;
    addPlayer(name);
    input.value = "";
    input.focus();
  };

  render();
  loadRoster();
</script>
